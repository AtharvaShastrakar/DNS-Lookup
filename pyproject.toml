[project]
name = "dnslookup-cli"
version = "0.1.0"
description = "DNS lookup CLI with email security auditing (MX, SPF, DKIM, DMARC), reverse lookups, tracing and WHOIS."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "dnspython>=2.6",
    "rich>=13.7",
    "typer>=0.12",
    "cryptography>=42",
]

[project.scripts]
dnslookup = "dnslookup.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dnslookup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["network: tests that hit real DNS servers"]
